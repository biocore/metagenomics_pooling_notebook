# NOTE: if you change this file,
# ALSO change the setup.py file
name: metapool
channels:
  - bioconda
  - conda-forge
  - anaconda
  - defaults
dependencies:
  # base requirements
  - biom-format
  - matplotlib
  - numpy
  - openpyxl
  - pandas>=3
  - pip
  - python=3.11
  - seaborn[version='>=0.13.2']
  - seqtk[version='>=1.4']
  - scikit-learn
  # testing requirements
  - flake8
  - pytest
  - pytest-cov
  - papermill
  - pep8
  # notebook requirements
  - jupyter
  - notebook
  - watermark
  - pip:
      # base requirements
      - sample-sheet
      - run-preflight @ git+https://github.com/the-miint/kl-run-preflight@03ee9e3b86132b97d42298380a43d9e52eaaad23
      # coverage requirements
      - coverage
      - coveralls
      # notebook requirements
      - ipyfilechooser
      - ipykernel
